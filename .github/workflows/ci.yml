name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"  # uv run 的隐式 sync 同样只认锁定版本
    services:
      postgres:
        # 与 docker-compose 生产库同款（PostgreSQL 15 + pgvector）
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoflux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "src/web/package-lock.json"

      - name: Frozen dependency install
        # uv.lock 是唯一依赖事实源：--frozen 在锁漂移时直接失败；
        # 后续所有步骤一律 uv run，保证测试确实跑在锁定的依赖版本上
        # （而非 setup-python 全局解释器里另一套宽约束安装）
        run: |
          pip install uv
          uv sync --frozen --extra dev --extra test

      - name: Install Playwright chromium
        # 插件兼容性检测要求 chromium 二进制就位（README 开发环境要求）
        run: uv run playwright install chromium

      - name: Dependency security audit
        # 已知漏洞依赖在 CI 即暴露（配合 .github/dependabot.yml 的周期更新）
        run: uv run --with pip-audit pip-audit --skip-editable

      - name: Compile sources
        run: uv run python -m compileall src/ plugins/ scripts/check_core_package.py scripts/check_plugin_release.py

      - name: Ruff (core and plugins)
        run: >
          uv run ruff check
          src/
          plugins/
          scripts/check_core_package.py
          scripts/check_plugin_release.py

      - name: Pyright (core/services/storage)
        # 分层接入：error 级阻断（Optional 调用/返回类型等），
        # argument-type 等深度类型债暂为 warning，见 pyrightconfig.json
        run: uv run pyright

      - name: Validate first-party plugin releases
        run: uv run python scripts/check_plugin_release.py

      - name: Agent workflow suite
        # Path workflows (report/review/pipeline/readiness/cron/multisource) + meta/routing
        run: >
          uv run pytest -q --tb=line
          tests/test_agent_workflow_cron.py
          tests/test_agent_workflow_multisource.py
          tests/test_agent_workflow_readiness.py
          tests/test_agent_workflow_events.py
          tests/test_agent_workflows.py
          tests/test_agent_workflow_matchers.py
          tests/test_agent_workflow_routing.py
          tests/test_agent_workflow_bridge_events.py
          tests/test_agent_workflow_result_cards.py
          tests/test_agent_workflow_runtime_nodes.py
          tests/test_agent_stream_events.py

      - name: Unit tests (skip integration)
        # Default CI gate: no live external services
        run: uv run pytest -m "not integration" -q --tb=line

      - name: Alembic migration tests (real Postgres)
        env:
          ALEMBIC_PG_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/autoflux
        run: uv run pytest tests/test_alembic_postgres.py -q --tb=line

      - name: Legacy static script syntax
        run: node --check src/web/static/app.js

      - name: Frontend install & production build
        working-directory: src/web
        run: |
          npm ci
          npm run build

      - name: Verify packaged core runtime resources
        run: uv run python scripts/check_core_package.py

  windows:
    # Windows 专属代码（ProactorEventLoop、路径处理、文件锁行为）回归线；
    # 全量非集成套件覆盖 Scheduler 生命周期与 Playwright 事件循环相关用例
    runs-on: windows-latest
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Frozen dependency install
        run: |
          pip install uv
          uv sync --frozen --extra dev --extra test

      - name: Install Playwright chromium
        run: uv run playwright install chromium

      - name: Compile sources
        run: uv run python -m compileall src/ plugins/ scripts/check_core_package.py scripts/check_plugin_release.py

      - name: Unit tests (skip integration)
        run: uv run pytest -m "not integration" -q --tb=line
