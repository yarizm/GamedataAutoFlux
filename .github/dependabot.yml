version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-and-runtime:
        patterns:
          - "*"
  # npm (src/web) 版本更新已停用：dependabot 每月重开同一批前端升级 PR
  # （marked 12→18、npm-minor-patch 组等），历次都未合并、被逐个关闭。
  # 前端依赖改为按需手动升级；恢复时从 git 历史取回这段配置。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
