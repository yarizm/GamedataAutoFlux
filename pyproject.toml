[project]
name = "gamedata-autoflux"
version = "0.1.0"
description = "可自定义、插件化的数据采集与工作流平台"
requires-python = ">=3.12"
dependencies = [
    # Managed plugin wheel builds
    "setuptools>=75.0",
    "wheel>=0.45.0",
    "packaging>=24.0",
    # Web framework
    "fastapi>=0.136.1,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    # Data validation
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    # Configuration
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    # Logging
    "loguru>=0.7.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "pgvector>=0.2.0,<1.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    # Scheduling
    "apscheduler>=3.10.0,<4.0.0",
    # Templating
    "jinja2>=3.1.0",
    # HTTP client (for collectors)
    "httpx>=0.27.0,<1.0.0",
    # Utilities
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.0",
    "tenacity>=8.0.0",
    # Excel report generation
    "openpyxl>=3.1.0",
    # WebSocket support
    "websockets>=12.0",
    # LangChain / LangGraph Agent
    "langchain>=1.0.0,<2.0.0",
    "langchain-community>=0.3.0,<1.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    # MCP
    "mcp>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0,<0.17",
    "aiosqlite>=0.20.0",
    "pyright>=1.1.400",
    "alembic>=1.19.0",
    "gamedata-autoflux[test]",
]
# 测试套件经 conftest 以源码方式加载全部第一方插件（不走 entry points），
# 因此插件的三方依赖必须在测试环境可用
test = [
    "pytrends>=4.9.2",
    "urllib3>=2.0.0",
    "firecrawl-py>=1.0.0,<3.0.0",
    "playwright>=1.40.0,<2.0.0",
    "build>=1.2.0",
    # 插件管理器运行时经 `python -m pip` 把 wheel 装进受管环境；
    # uv 管理的 venv 默认不含 pip，测试环境显式声明
    "pip>=24.0",
]
vector = [
    "chromadb>=0.5.0",
]
embedding = [
    "openai>=1.40.0",
]

[project.scripts]
autoflux = "src.web.app:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.plugin_manager" = ["catalog.json"]
"src.web" = [
    "templates/*.html",
    "templates/components/*.html",
    "templates/pages/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.svg",
    "static/core/*.js",
    "static/dist/.vite/*.json",
    "static/dist/assets/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that access real external services (skipped in CI by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# 显式锁定规则集：0.16+ 的新默认引入大量风格类规则（BLE/UP/SIM/TRY/DTZ...），
# 与项目既有约定不符且随版本漂移。这里固定为经典默认 + isort；
# 新规则按需逐个加入，避免上游默认集变化打爆 CI。
[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
