[project]
name = "gamedata-autoflux"
version = "0.1.0"
description = "可自定义、插件化的数据采集与工作流平台"
requires-python = ">=3.12"
dependencies = [
    # Managed plugin wheel builds
    "setuptools>=75.0",
    "wheel>=0.45.0",
    "packaging>=24.0",
    # Web framework
    "fastapi>=0.136.1,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    # Data validation
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    # Configuration
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    # Logging
    "loguru>=0.7.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "pgvector>=0.2.0,<1.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    # Scheduling
    "apscheduler>=3.10.0,<4.0.0",
    # Templating
    "jinja2>=3.1.0",
    # HTTP client (for collectors)
    "httpx>=0.27.0,<1.0.0",
    # Utilities
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.0",
    "tenacity>=8.0.0",
    # Excel report generation
    "openpyxl>=3.1.0",
    # WebSocket support
    "websockets>=12.0",
    # LangChain / LangGraph Agent
    "langchain>=1.0.0,<2.0.0",
    "langchain-community>=0.3.0,<1.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    # MCP
    "mcp>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "aiosqlite>=0.20.0",
    "pyright>=1.1.400",
    "alembic>=1.19.0",
]
vector = [
    "chromadb>=0.5.0",
]
embedding = [
    "openai>=1.40.0",
]

[project.scripts]
autoflux = "src.web.app:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.plugin_manager" = ["catalog.json"]
"src.web" = [
    "templates/*.html",
    "templates/components/*.html",
    "templates/pages/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.svg",
    "static/core/*.js",
    "static/dist/.vite/*.json",
    "static/dist/assets/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that access real external services (skipped in CI by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
