<section class="tab-content" id="tab-dag">
            <div class="section-header">
                <h1 data-i18n="dag.title">DAG 编辑器</h1>
                <div class="flex items-center gap-2 flex-wrap dag-toolbar">
                    <input id="dag-name-input" type="text" data-i18n-placeholder="dag.namePlaceholder" placeholder="DAG 名称" class="input h-9 w-40 text-sm" />
                    <span id="dag-dirty" class="dag-dirty" hidden></span>
                    <div class="dag-toolbar-group">
                        <button class="btn btn-ghost btn-sm" id="btn-dag-undo" type="button" data-i18n-title="dag.undoTitle" title="撤销 (Ctrl+Z)" disabled data-i18n="dag.undo">撤销</button>
                        <button class="btn btn-ghost btn-sm" id="btn-dag-redo" type="button" data-i18n-title="dag.redoTitle" title="重做 (Ctrl+Shift+Z)" disabled data-i18n="dag.redo">重做</button>
                    </div>
                    <div class="dag-toolbar-group">
                        <button class="btn btn-ghost btn-sm" id="btn-dag-layout" type="button" data-i18n="dag.layout">整理布局</button>
                        <button class="btn btn-ghost btn-sm" id="btn-dag-fit" type="button" data-i18n="dag.fit">适应画布</button>
                    </div>
                    <div class="dag-toolbar-group">
                        <button class="btn btn-ghost btn-sm" id="btn-dag-import" type="button" data-i18n="dag.import">导入</button>
                        <button class="btn btn-ghost btn-sm" id="btn-dag-export" type="button" data-i18n="dag.export">导出</button>
                        <input id="dag-import-file" type="file" accept=".json,application/json" hidden />
                    </div>
                    <button class="btn btn-ghost" id="btn-dag-validate" type="button" data-i18n="dag.validate">校验</button>
                    <button class="btn btn-secondary" id="btn-dag-clear" type="button" data-i18n="dag.clear">清空</button>
                    <button class="btn btn-secondary" id="btn-dag-save" type="button">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        <span data-i18n="dag.save">保存 DAG</span>
                    </button>
                    <button class="btn btn-primary" id="btn-dag-run" type="button">
                        <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                        <span data-i18n="dag.run.button">运行</span>
                    </button>
                </div>
            </div>

            <section class="inline-guide-shell dag-inline-guide"
                     data-inline-guide="dag-quickstart"
                     data-inline-guide-version="v1"
                     data-tour-id="dag-quickstart">
                <header class="inline-guide-header">
                    <div>
                        <strong data-i18n="dag.guide.title">DAG 四步上手</strong>
                        <small data-i18n="dag.guide.subtitle">点击节点加入画布，连接端口，再配置固定值或上游映射。</small>
                    </div>
                    <button type="button" class="btn btn-ghost btn-sm" data-inline-guide-toggle aria-expanded="true">收起说明</button>
                </header>
                <div class="dag-onboarding" data-inline-guide-body>
                    <div><span>1</span><strong data-i18n="dag.onboarding.collector">添加采集器</strong><small data-i18n="dag.onboarding.collectorHint">决定从哪里采集；目标参数在创建任务时填写</small></div>
                    <b>→</b>
                    <div><span>2</span><strong data-i18n="dag.onboarding.processor">连接处理节点</strong><small data-i18n="dag.onboarding.processorHint">可选：清洗或转换 records</small></div>
                    <b>→</b>
                    <div><span>3</span><strong data-i18n="dag.onboarding.storage">连接存储节点</strong><small data-i18n="dag.onboarding.storageHint">保存结果后校验并命名 DAG</small></div>
                    <b>→</b>
                    <div><span>4</span><strong data-i18n="dag.onboarding.task">创建任务</strong><small data-i18n="dag.onboarding.taskHint">选择这个 DAG，再填写本次运行目标</small></div>
                </div>
            </section>

            <div id="dag-validate-bar" class="text-xs text-muted mb-2 px-1"></div>
            <div id="dag-run-bar" class="dag-run-bar" hidden></div>

            <div class="dag-layout grid grid-cols-12 gap-4">
                <aside class="col-span-3 space-y-4">
                    <div class="card rounded-2xl p-4 mb-0" data-tour-id="dag-palette">
                        <div class="flex items-center justify-between mb-3">
                            <h2 class="font-bold tracking-tight text-sm uppercase" data-i18n="dag.saved">已保存</h2>
                            <button type="button" class="text-muted hover:text-[var(--info)] text-[10px]" id="btn-dag-refresh-list" data-i18n="dag.refresh" data-i18n-title="dag.refreshList" title="刷新列表">刷新</button>
                        </div>
                        <div id="dag-saved-list" class="space-y-1 max-h-48 overflow-y-auto">
                            <p class="text-muted text-xs" data-i18n="common.loading">加载中...</p>
                        </div>
                        <p class="text-muted text-[10px] mt-2" data-i18n="dag.savedHint">保存后会出现在此列表，也可在「创建任务」中选择</p>
                    </div>
                    <div class="card rounded-2xl p-4 mb-0">
                        <h2 class="font-bold tracking-tight text-sm uppercase mb-3" data-i18n="dag.palette">节点库</h2>
                        <div id="dag-palette" class="dag-palette max-h-[48vh] overflow-y-auto">
                            <p class="text-muted text-xs" data-i18n="common.loading">加载中...</p>
                        </div>
                    </div>
                </aside>

                <main class="col-span-6 card rounded-2xl p-0 overflow-hidden mb-0" data-tour-id="dag-canvas">
                    <div class="card-header px-4 pt-4 pb-2 border-b flex items-center justify-between mb-0">
                        <h2 class="font-bold tracking-tight text-sm uppercase" data-i18n="dag.canvas">画布</h2>
                        <span class="text-muted text-[10px]" data-i18n="dag.canvasHint">空白处/中键/空格+拖 平移 · 滚轮缩放 · 端口连线 · 右侧映射上游字段</span>

                    </div>
                    <div id="dag-canvas-wrap" class="dag-canvas-wrap relative" style="height: 65vh;">
                        <div id="drawflow" class="w-full h-full"></div>
                    </div>
                </main>

                <aside class="col-span-3">
                    <div class="card rounded-2xl p-4 mb-0 dag-inspector-card" id="dag-inspector" data-tour-id="dag-inspector">
                        <p class="text-muted text-xs" data-i18n="dag.selectHint">选中节点或边以编辑属性</p>
                    </div>
                </aside>
            </div>
        </section>
