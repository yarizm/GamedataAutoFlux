[project]
name = "autoflux-plugin-steam"
version = "0.1.0"
description = "Steam collectors for GamedataAutoFlux"
license = "MIT"
authors = [{ name = "Autoflux Contributors" }]
requires-python = ">=3.12"
dependencies = [
    "gamedata-autoflux>=0.1.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "playwright>=1.40.0",
    "firecrawl-py>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yarizm/GamedataAutoFlux"
Repository = "https://github.com/yarizm/GamedataAutoFlux"
Issues = "https://github.com/yarizm/GamedataAutoFlux/issues"

[project.entry-points."gamedata_autoflux.plugins"]
steam = "autoflux_plugin_steam:plugin"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
