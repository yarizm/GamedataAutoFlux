[project]
name = "autoflux-plugin-qimai"
version = "0.1.0"
description = "Qimai collector for GamedataAutoFlux"
license = "MIT"
authors = [{ name = "Autoflux Contributors" }]
requires-python = ">=3.12"
dependencies = ["gamedata-autoflux>=0.1.0", "playwright>=1.40.0"]

[project.urls]
Homepage = "https://github.com/yarizm/GamedataAutoFlux"
Repository = "https://github.com/yarizm/GamedataAutoFlux"
Issues = "https://github.com/yarizm/GamedataAutoFlux/issues"

[project.entry-points."gamedata_autoflux.plugins"]
qimai = "autoflux_plugin_qimai:plugin"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
